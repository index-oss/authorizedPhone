name: Inspect Dataset Metadata

on: [push, workflow_dispatch]

jobs:
inspect: 
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: pip install huggingface_hub pyarrow fsspec requests aiohttp

  - name: Inspect phone index
    run: python dataset_lookup.py
