name: Inspect Dataset Metadata

on:
push:
branches:
- feature/dataset-integration
paths:
- ".github/workflows/inspect-dataset.yml"
- "dataset_lookup.py"
- "inspect_phone_index.py"
- "requirements.txt"
workflow_dispatch:

permissions:
contents: read

jobs:
inspect:
runs-on: ubuntu-latest
timeout-minutes: 15

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: python -m pip install -r requirements.txt

  - name: Inspect phone index
    run: python dataset_lookup.py
